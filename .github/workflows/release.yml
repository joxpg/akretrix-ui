name: CI & Automated Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Manual Semantic Version Override (optional)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  # ── STAGE 1: QUALITY GATE (Runs on all PRs and pushes to main) ───────────
  quality-gate:
    name: Quality Gate (Typecheck, Build & Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Typecheck
        run: pnpm run typecheck

      - name: Build Package Distribution (dist/)
        run: pnpm run build

      - name: Execute Automated Test Suite
        run: pnpm test

  # ── STAGE 2: AUTOMATED SEMANTIC RELEASE & PUBLISH ────────────────────────
  # Only executes on main branch or tags, and ONLY after Quality Gate passes!
  semantic-release-publish:
    name: Automated Semantic Release & Publish
    needs: [quality-gate]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24 with GitHub Packages Registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@joxpg'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm run build

      - name: Calculate Semantic Version Bump from Commits
        id: semver
        run: |
          MANUAL_BUMP="${{ inputs.bump }}"
          
          if [ "$MANUAL_BUMP" != "" ] && [ "$MANUAL_BUMP" != "auto" ]; then
            BUMP_TYPE="$MANUAL_BUMP"
            echo "Using manual bump override: $BUMP_TYPE"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            
            if [ -z "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline -n 20)
            else
              COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
            fi
            
            echo "Commits since last release:"
            echo "$COMMITS"
            
            if echo "$COMMITS" | grep -qiE "(BREAKING CHANGE|!:|\(breaking\))"; then
              BUMP_TYPE="major"
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat(\(.*\))?:"; then
              BUMP_TYPE="minor"
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ fix(\(.*\))?:"; then
              BUMP_TYPE="patch"
            else
              BUMP_TYPE="patch"
            fi
          fi

          echo "Determined semantic version bump: $BUMP_TYPE"
          echo "BUMP_TYPE=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Check if Current Version Already Published
        id: check_published
        run: |
          CURRENT_PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Current package.json version: $CURRENT_PKG_VERSION"
          
          PUBLISHED_VERSIONS=$(npm view @joxpg/akretrix-ui versions --json --registry=https://npm.pkg.github.com 2>/dev/null || echo "[]")
          echo "Existing published versions: $PUBLISHED_VERSIONS"
          
          if echo "$PUBLISHED_VERSIONS" | grep -q "\"$CURRENT_PKG_VERSION\""; then
            echo "Current version $CURRENT_PKG_VERSION is already published. Bumping with ${{ steps.semver.outputs.BUMP_TYPE }}..."
            npm version ${{ steps.semver.outputs.BUMP_TYPE }} --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "IS_NEW_VERSION=true" >> $GITHUB_OUTPUT
          else
            echo "Current version $CURRENT_PKG_VERSION is brand new and not yet on registry."
            NEW_VERSION="$CURRENT_PKG_VERSION"
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "IS_NEW_VERSION=true" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild with New Version
        run: pnpm run build

      - name: Publish Package to GitHub Packages
        run: |
          echo "Publishing @joxpg/akretrix-ui@${{ steps.check_published.outputs.NEW_VERSION }} to GitHub Packages..."
          pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Version Bump & Create Git Tag
        run: |
          VERSION="v${{ steps.check_published.outputs.NEW_VERSION }}"
          
          if [ -n "$(git status --porcelain package.json)" ]; then
            git add package.json
            git commit -m "chore(release): $VERSION [skip ci]"
            git push origin main
          fi

          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tagging: $VERSION"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_published.outputs.NEW_VERSION }}
          name: Release v${{ steps.check_published.outputs.NEW_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
